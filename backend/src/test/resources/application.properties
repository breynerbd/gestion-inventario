spring.datasource.url=jdbc:h2:mem:inventory_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.liquibase.enabled=false

app.security.jwt.secret=test-secret-key-for-testing-only-12345678901234567890
app.security.jwt.access-expiration=900000
app.security.jwt.refresh-expiration=604800000

management.tracing.enabled=false
management.otlp.metrics.export.enabled=false