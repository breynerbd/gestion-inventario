databaseChangeLog:
  - changeSet:
      id: 010-binnacle
      author: hogar
      changes:
        - createTable:
            tableName: binnacle
            columns:
              - column:
                  name: log_id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                    name: username
                    type: VARCHAR(50)
                    constraints:
                      nullable: false

              - column:
                  name: date_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: ip_address
                  type: VARCHAR(45)
                  constraints:
                    nullable: false

              - column:
                  name: result
                  type: VARCHAR(10)
                  constraints:
                    nullable: false