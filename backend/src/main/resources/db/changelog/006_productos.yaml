databaseChangeLog:
  - changeSet:
      id: 1787852569580-5
      author: hogar
      changes:
        - createTable:
            tableName: productos
            columns:
              - column:
                  name: id_producto
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: productos_pkey

              - column:
                  name: codigo_producto
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: nombre_producto
                  type: VARCHAR(120)
                  constraints:
                    nullable: false

              - column:
                  name: descripcion
                  type: VARCHAR(500)

              - column:
                  name: id_categoria
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: id_proveedor
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: unidad_medida
                  type: VARCHAR(15)
                  constraints:
                    nullable: false

              - column:
                  name: precio_compra
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false

              - column:
                  name: precio_venta
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false

              - column:
                  name: stock_actual
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: stock_minimo
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: stock_maximo
                  type: INTEGER

              - column:
                  name: estado
                  type: VARCHAR(10)
                  defaultValue: ACTIVO
                  constraints:
                    nullable: false

  - changeSet:
      id: 1787852569580-16
      author: hogar  
      changes:
        - addUniqueConstraint:
            columnNames: codigo_producto
            constraintName: productos_codigo_producto_key
            tableName: productos

  - changeSet:
      id: 1787852569580-20
      author: hogar  
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: id_categoria
            baseTableName: productos
            constraintName: fk_productos_categorias
            referencedColumnNames: id_categoria
            referencedTableName: categorias
            onDelete: NO ACTION
            onUpdate: NO ACTION
            validate: true

  - changeSet:
      id: 1787852569580-21
      author: hogar  
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: id_proveedor
            baseTableName: productos
            constraintName: fk_productos_proveedores
            referencedColumnNames: id_proveedor
            referencedTableName: proveedores
            onDelete: NO ACTION
            onUpdate: NO ACTION
            validate: true