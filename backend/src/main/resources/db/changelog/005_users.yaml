databaseChangeLog:
  - changeSet:
      id: 1787852569580-4
      author: hogar
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: users_pkey

              - column:
                  name: username
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: first_names
                  type: VARCHAR(60)
                  constraints:
                    nullable: false

              - column:
                  name: last_names
                  type: VARCHAR(60)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: phone
                  type: VARCHAR(15)

              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(10)
                  defaultValue: ACTIVO
                  constraints:
                    nullable: false

              - column:
                  name: failed_attempts
                  type: INTEGER
                  defaultValueNumeric: 0

  - changeSet:
      id: 1787852569580-14
      author: hogar  
      changes:
        - addUniqueConstraint:
            columnNames: email
            constraintName: users_email_key
            tableName: users

  - changeSet:
      id: 1787852569580-15
      author: hogar  
      changes:
        - addUniqueConstraint:
            columnNames: username
            constraintName: users_username_key
            tableName: users