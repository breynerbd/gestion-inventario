databaseChangeLog:
  - changeSet:
      id: 018-supplier-audit-users
      author: herli
      changes:
        - addColumn:
            tableName: suppliers
            columns:
              - column:
                  name: created_by
                  type: BIGINT
              - column:
                  name: modified_by
                  type: BIGINT

        - addForeignKeyConstraint:
            baseTableName: suppliers
            baseColumnNames: created_by
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_suppliers_created_by

        - addForeignKeyConstraint:
            baseTableName: suppliers
            baseColumnNames: modified_by
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_suppliers_modified_by

