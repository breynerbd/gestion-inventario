  - changeSet:
      id: 1787852569580-30
      author: hogar
      comment: Datos maestros iniciales de roles, conforme a la seccion 3.2
      changes:
        - sql:
            sql: |
              insert into roles (id_rol, nombre_rol, descripcion, estado)
              OVERRIDING SYSTEM VALUE VALUES
              (1, 'ADMINISTRADOR', 'Acceso completo al sistema', 'ACTIVO'),
              (2, 'SUPERVISOR', 'Gestiona catalogos y consulta reportes', 'ACTIVO'),
              (3, 'OPERADOR', 'Registra movimientos de stock y consulta catalogo', 'ACTIVO');

