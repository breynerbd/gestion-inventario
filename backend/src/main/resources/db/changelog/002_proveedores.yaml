databaseChangeLog:
  - changeSet:
      id: 1787852569580-2
      author: hogar
      changes:
        - createTable:
            tableName: proveedores
            columns:
              - column:
                  name: id_proveedor
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: proveedores_pkey

              - column:
                  name: codigo_proveedor
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: tipo_documento
                  type: VARCHAR(15)
                  constraints:
                    nullable: false

              - column:
                  name: numero_documento
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: razon_social
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: nombre_contacto
                  type: VARCHAR(100)

              - column:
                  name: telefono
                  type: VARCHAR(15)
                  constraints:
                    nullable: false

              - column:
                  name: correo_electronico
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: direccion
                  type: VARCHAR(200)

              - column:
                  name: estado
                  type: VARCHAR(10)
                  defaultValue: ACTIVO
                  constraints:
                    nullable: false

  - changeSet:
      id: 1787852569580-10
      author: hogar  
      changes:
        - addUniqueConstraint:
            columnNames: codigo_proveedor
            constraintName: proveedores_codigo_proveedor_key
            tableName: proveedores

  - changeSet:
      id: 1787852569580-11
      author: hogar  
      changes:
        - addUniqueConstraint:
            columnNames: correo_electronico
            constraintName: proveedores_correo_electronico_key
            tableName: proveedores

  - changeSet:
      id: 1787852569580-12
      author: hogar  
      changes:
        - addUniqueConstraint:
            columnNames: numero_documento
            constraintName: proveedores_numero_documento_key
            tableName: proveedores