databaseChangeLog:
  - changeSet:
      id: 019-create-audit-logs
      author: herli
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: audit_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: module
                  type: VARCHAR(40)
                  constraints:
                    nullable: false

              - column:
                  name: record_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: action
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: occurred_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: audit_logs
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_audit_logs_user