databaseChangeLog:
  - changeSet:
      id: 010-bitacora
      author: hogar
      changes:
        - createTable:
            tableName: bitacora
            columns:
              - column:
                  name: id_bitacora
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                    name: nombre_usuario
                    type: VARCHAR(50)
                    constraints:
                      nullable: false

              - column:
                  name: fecha_hora
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: direccion_ip
                  type: VARCHAR(45)
                  constraints:
                    nullable: false

              - column:
                  name: resultado
                  type: VARCHAR(10)
                  constraints:
                    nullable: false