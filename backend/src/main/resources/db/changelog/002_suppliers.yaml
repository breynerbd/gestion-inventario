databaseChangeLog:
  - changeSet:
      id: 1787852569580-2
      author: hogar
      changes:
        - createTable:
            tableName: suppliers
            columns:
              - column:
                  name: supplier_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: supplier_pkey

              - column:
                  name: supplier_code
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: document_type
                  type: VARCHAR(15)
                  constraints:
                    nullable: false

              - column:
                  name: document_number
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: business_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: contact_name
                  type: VARCHAR(100)

              - column:
                  name: phone
                  type: VARCHAR(15)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: address
                  type: VARCHAR(200)

              - column:
                  name: status
                  type: VARCHAR(10)
                  defaultValue: ACTIVO
                  constraints:
                    nullable: false

  - changeSet:
      id: 1787852569580-10
      author: hogar  
      changes:
        - addUniqueConstraint:
            columnNames: supplier_code
            constraintName: suppliers_supplier_code_key
            tableName: suppliers

  - changeSet:
      id: 1787852569580-11
      author: hogar  
      changes:
        - addUniqueConstraint:
            columnNames: email
            constraintName: suppliers_email_key
            tableName: suppliers

  - changeSet:
      id: 1787852569580-12
      author: hogar  
      changes:
        - addUniqueConstraint:
            columnNames: document_number
            constraintName: suppliers_document_number_key
            tableName: suppliers