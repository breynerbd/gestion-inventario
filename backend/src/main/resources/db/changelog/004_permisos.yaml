databaseChangeLog:
  - changeSet:
      id: 1787852569580-8
      author: hogar
      changes:
        - createTable:
            tableName: permisos
            columns:
              - column:
                  name: id_permiso
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: permisos_pkey

              - column:
                  name: codigo_permiso
                  type: VARCHAR(60)
                  constraints:
                    nullable: false

              - column:
                  name: nombre_permiso
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: modulo
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: descripcion
                  type: VARCHAR(200)

  - changeSet:
      id: 1787852569580-17
      author: hogar  
      changes:
        - addUniqueConstraint:
            columnNames: codigo_permiso
            constraintName: permisos_codigo_permiso_key
            tableName: permisos