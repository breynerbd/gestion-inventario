databaseChangeLog:
  - changeSet:
      id: 1787852569580-7
      author: hogar
      changes:
        - createTable:
            tableName: rol_permiso
            columns:
              - column:
                  name: id_rol
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: rol_permiso_pkey

              - column:
                  name: id_permiso
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: rol_permiso_pkey

              - column:
                  name: fecha_asignacion
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP

  - changeSet:
      id: 1787852569580-22
      author: hogar  
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: id_permiso
            baseTableName: rol_permiso
            constraintName: fk_rol_permiso_permisos
            referencedColumnNames: id_permiso
            referencedTableName: permisos
            onDelete: NO ACTION
            onUpdate: NO ACTION
            validate: true

  - changeSet:
      id: 1787852569580-23
      author: hogar  
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: id_rol
            baseTableName: rol_permiso
            constraintName: fk_rol_permiso_roles
            referencedColumnNames: id_rol
            referencedTableName: roles
            onDelete: NO ACTION
            onUpdate: NO ACTION
            validate: true