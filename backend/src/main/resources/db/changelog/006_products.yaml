databaseChangeLog:
  - changeSet:
      id: 1787852569580-5
      author: hogar
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: product_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: products_pkey

              - column:
                  name: product_code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: product_name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(500)

              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: supplier_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: unit_of_measure
                  type: VARCHAR(15)
                  constraints:
                    nullable: false

              - column:
                  name: purchase_price
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false

              - column:
                  name: sale_price
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false

              - column:
                  name: current_stock
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: minimum_stock
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: maximum_stock
                  type: INTEGER

              - column:
                  name: status
                  type: VARCHAR(10)
                  defaultValue: ACTIVO
                  constraints:
                    nullable: false

  - changeSet:
      id: 1787852569580-16
      author: hogar  
      changes:
        - addUniqueConstraint:
            columnNames: product_code
            constraintName: products_product_code_key
            tableName: products

  - changeSet:
      id: 1787852569580-20
      author: hogar  
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: category_id
            baseTableName: products
            constraintName: fk_products_categories
            referencedColumnNames: category_id
            referencedTableName: categories
            onDelete: NO ACTION
            onUpdate: NO ACTION
            validate: true

  - changeSet:
      id: 1787852569580-21
      author: hogar  
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: supplier_id
            baseTableName: products
            constraintName: fk_products_suppliers
            referencedColumnNames: supplier_id
            referencedTableName: suppliers
            onDelete: NO ACTION
            onUpdate: NO ACTION
            validate: true