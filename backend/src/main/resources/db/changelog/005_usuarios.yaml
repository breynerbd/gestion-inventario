databaseChangeLog:
  - changeSet:
      id: 1787852569580-4
      author: hogar
      changes:
        - createTable:
            tableName: usuarios
            columns:
              - column:
                  name: id_usuario
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: usuarios_pkey

              - column:
                  name: nombre_usuario
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: contrasena
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: nombres
                  type: VARCHAR(60)
                  constraints:
                    nullable: false

              - column:
                  name: apellidos
                  type: VARCHAR(60)
                  constraints:
                    nullable: false

              - column:
                  name: correo_electronico
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: telefono
                  type: VARCHAR(15)

              - column:
                  name: id_rol
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: estado
                  type: VARCHAR(10)
                  defaultValue: ACTIVO
                  constraints:
                    nullable: false

              - column:
                  name: intentos_fallidos
                  type: INTEGER
                  defaultValueNumeric: 0

  - changeSet:
      id: 1787852569580-14
      author: hogar  
      changes:
        - addUniqueConstraint:
            columnNames: correo_electronico
            constraintName: usuarios_correo_electronico_key
            tableName: usuarios

  - changeSet:
      id: 1787852569580-15
      author: hogar  
      changes:
        - addUniqueConstraint:
            columnNames: nombre_usuario
            constraintName: usuarios_nombre_usuario_key
            tableName: usuarios
  
  - changeSet:
      id: 1787852569580-24
      author: hogar
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: id_rol
            baseTableName: usuarios
            constraintName: fk_usuarios_roles
            referencedColumnNames: id_rol
            referencedTableName: roles
            onDelete: NO ACTION
            onUpdate: NO ACTION
            validate: true