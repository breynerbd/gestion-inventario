databaseChangeLog:
  - changeSet:
      id: 1787852569580-3
      author: hogar
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: role_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: roles_pkey

              - column:
                  name: role_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(200)

              - column:
                  name: status
                  type: VARCHAR(10)
                  defaultValue: ACTIVO
                  constraints:
                    nullable: false

  - changeSet:
      id: 1787852569580-13
      author: hogar  
      changes:
        - addUniqueConstraint:
            columnNames: role_name
            constraintName: roles_role_name_key
            tableName: roles