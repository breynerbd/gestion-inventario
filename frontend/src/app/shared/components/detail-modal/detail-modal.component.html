@if (visible) {
<div class="detail-modal-overlay">
    <button type="button" class="detail-modal-backdrop" aria-label="Cerrar detalles" (click)="close()">
    </button>

    <dialog class="detail-modal" open aria-modal="true" [attr.aria-label]="title" (keydown.escape)="close()">

        <header class="detail-modal-header">
            <h2>{{ title }}</h2>

            <button type="button" class="close-button" (click)="close()" aria-label="Cerrar detalles">
                &times;
            </button>
        </header>

        <div class="detail-modal-content">
            @for (field of fields; track field.label) {
            <div class="detail-field" [class.full-width]="field.label === 'Descripción' || field.label === 'Motivo' || field.label === 'Dirección'">
                <span class="detail-field-label">{{ field.label }}</span>
                <span class="detail-field-value">
                    {{ field.value ?? '—' }}
                </span>
            </div>
            }
        </div>
    </dialog>
</div>
}
