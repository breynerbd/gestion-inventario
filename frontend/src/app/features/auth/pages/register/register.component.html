<div class="register-container">
    <div class="register-card">
        
        <h1>Crear Cuenta</h1>
        <p class="subtitle">Registrate para comenzar</p>
        
        <form (ngSubmit)="register()">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstNames">Nombres</label>
                    <input type="text" id="firstNames" name="firstNames" [(ngModel)]="firstNames"
                        placeholder="Ingresa tus nombres" required>
                </div>

                <div class="form-group">
                    <label for="lastNames">Apellidos</label>
                    <input type="text" id="lastNames" name="lastNames" [(ngModel)]="lastNames"
                        placeholder="Ingresa tus apellidos" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" [(ngModel)]="username"
                        placeholder="Ingresa un nombre de usuario" required>
                </div>

                <div class="form-group">
                    <label for="phone">Teléfono</label>
                    <input type="text" id="phone" name="phone" [(ngModel)]="phone"
                        placeholder="Ingresa tu número de teléfono" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Correo Electronico</label>
                <input type="text" id="email" name="email" [(ngModel)]="email"
                    placeholder="Ingresa tu correo electronico" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" [(ngModel)]="password"
                    placeholder="Ingresa tu contraseña" required>
            </div>

            @if (errorMessage) {
                <p class="error-message">{{ errorMessage }}</p>
            }

            <button type="submit">
                Crear Cuenta
            </button>
            
            <div class="link-login">
                ¿Ya tienes una cuenta? <a routerLink="/login">Inicia Sesión</a>
            </div>
        </form>
    </div>
</div>
