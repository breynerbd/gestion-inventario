<div class="dashboard-container">
    <header class="dashboard-header">
        <div>
            <h1>Gestion De Inventario</h1>
        </div>

        <div class="user-info">
            <div class="user-details">
                <p>{{ username }} |</p>
                <span>{{ roleName }} |</span>
            </div>

            <div class="profile">
                <img src="/usuario.png" alt="">
            </div>
        </div>
    </header>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <nav class="menu">
                <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Panel Principal</a>
                <a routerLink="/dashboard/products" routerLinkActive="active">Productos</a>
                <a routerLink="/dashboard/movements" routerLinkActive="active">Movimientos</a>
                <a routerLink="/dashboard/categories" routerLinkActive="active">Categorias</a>
                <a routerLink="/dashboard/suppliers" routerLinkActive="active">Proveedores</a>
                @if (canManageUsers()) {<a routerLink="/dashboard/users" routerLinkActive="active">Usuarios</a>}
                @if (canManageRoles()) {<a routerLink="/dashboard/roles" routerLinkActive="active">Roles</a>}
                @if (canManagePermissions()) {<a routerLink="/dashboard/permissions" routerLinkActive="active">Permisos</a>}
            </nav>

            <div class="sidebar-foot">
                <button type="button" (click)="logout()">
                    Cerrar Sesión
                </button>
            </div>
        </aside>

        <main class="dashboard">
            <div class="dashboard-card">
                <router-outlet></router-outlet>
            </div>
        </main>
    </div>

</div>
